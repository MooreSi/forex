[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "forex-trader"
version = "1.0.0"
description = "FOREX Trader — XAUUSD Gold Simulation App with NiceGUI"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=1.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "anthropic>=0.36.0",
    "telethon>=1.36.0",
    "PyYAML>=6.0",
]

[project.scripts]
forex-trader = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forex_trader*"]
